<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Kelola Data — KDMP Kalurahan Kedungsari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5EE; --paper:#fff; --ink:#1F2A2E; --ink-soft:#5B676B;
  --teal:#0E5A6E; --teal-dark:#0A4252; --lime:#A3B91A; --gold:#E8A81C; --red:#B5382A; --ok:#2E7D32;
  --line:rgba(14,90,110,.14); --shadow:0 14px 34px -18px rgba(14,90,110,.35);
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --font-display:'Fraunces',Georgia,serif; --font-body:'Work Sans','Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{font-family:inherit}

.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:12px;padding-bottom:12px}
.brand strong{display:block;font-family:var(--font-display);color:var(--teal);font-size:1.25rem;line-height:1.15}
.brand p{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.top-actions{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;justify-content:flex-end}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:100px;
  padding:10px 20px;font-weight:700;font-size:.88rem;cursor:pointer;background:var(--teal);color:#fff;text-decoration:none;transition:background .2s
}
.btn:hover{background:var(--teal-dark)}
.btn:disabled{background:#c9cfd1;color:#6b7478;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--teal-dark);border:1.5px solid var(--teal)}
.btn.ghost:hover{background:rgba(14,90,110,.08)}
.btn.ghost:disabled{background:transparent;border-color:#c9cfd1;color:#9aa2a5}
.btn.danger{background:var(--red)}
.btn.sm{padding:8px 16px;font-size:.82rem}

.field label{display:block;font-size:.8rem;font-weight:600;color:var(--ink-soft);margin-bottom:.3rem}
.field input{
  width:100%;padding:10px 12px;border-radius:var(--r-sm);border:1.5px solid var(--line);
  font:inherit;font-size:.92rem;background:var(--bg);color:var(--ink)
}
.field input:focus{outline:none;border-color:var(--teal);background:#fff}
.msg{font-size:.85rem;margin-top:.7rem;min-height:1.2em}
.msg.err{color:var(--red)} .msg.ok{color:var(--ok)}


.app{padding-top:20px;padding-bottom:70px}
.ov{position:fixed;inset:0;background:rgba(20,35,40,.5);z-index:200;display:none}
.ov.open{display:block}
.modal{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 40px));background:var(--paper);
  border-radius:var(--r-lg);padding:1.7rem 1.6rem 1.4rem;z-index:201;display:none;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)
}
.modal.open{display:block}
.modal h4{font-family:var(--font-display);color:var(--teal);font-size:1.2rem;margin-bottom:.8rem}
.modal .acts{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:flex-end;margin-top:1rem}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,10px);background:var(--teal-dark);color:#fff;padding:12px 22px;border-radius:100px;
  font-size:.88rem;font-weight:600;opacity:0;transition:all .3s;z-index:300;pointer-events:none;max-width:calc(100vw - 40px);text-align:center
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.tab{border:1.5px solid var(--line);background:var(--paper);color:var(--teal-dark);font-weight:700;font-size:.86rem;padding:8px 18px;border-radius:100px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}
.tab small{opacity:.75;font-weight:600;margin-left:4px}
.tools{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin-bottom:.9rem}
.tools .field{flex:1;min-width:180px}
.note{font-size:.82rem;color:var(--ink-soft);margin-bottom:.9rem}
.tw{background:var(--paper);border-radius:var(--r-md);box-shadow:var(--shadow);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{padding:.65rem .9rem;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);background:#FAF8F2;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.act{white-space:nowrap;text-align:right}
td.act .btn{margin-left:.3rem}
.trunc{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.off td{opacity:.55}
.empty{padding:2rem;text-align:center;color:var(--ink-soft)}
.fm{width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px);overflow-y:auto}
.fm .acts{position:sticky;bottom:-1.4rem;background:var(--paper);padding:.8rem 0 .2rem;margin-top:.4rem}
.fm .grid2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.fm .field{margin-bottom:.8rem}
.fm .field.full{grid-column:1/-1}
.fm .field select,.fm .field textarea{width:100%;padding:10px 12px;border-radius:var(--r-sm);border:1.5px solid var(--line);font:inherit;font-size:.92rem;background:var(--bg);color:var(--ink)}
.fm .field textarea{min-height:96px;resize:vertical}
.fm .field .h{font-size:.74rem;color:var(--ink-soft);margin-top:3px}
.fm .chk{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem}
.fm .chk input{width:auto}
.req{color:var(--red)}
@media (max-width:640px){ .brand strong{font-size:1.05rem} .fm .grid2{grid-template-columns:1fr} }
</style>
</head>
<body>

<header class="top">
  <div class="wrap bar">
    <div class="brand"><strong>Kelola Data</strong><p>KDMP Kalurahan Kedungsari</p></div>
    <div class="top-actions">
      <a class="btn ghost sm" href="dashboard.html">← Dashboard</a>
      <button class="btn ghost sm" id="logoutBtn" type="button">Keluar</button>
    </div>
  </div>
</header>

<main class="wrap app" id="appView">
  <div class="tabs" role="tablist" id="tabs"></div>
  <p class="note" id="note"></p>
  <div class="tools">
    <div class="field"><input type="search" id="q" placeholder="Cari…" aria-label="Cari"></div>
    <button class="btn ghost sm" id="reloadBtn" type="button">↻ Muat ulang</button>
    <button class="btn sm" id="addBtn" type="button">+ Tambah</button>
  </div>
  <p class="msg err" id="loadErr" role="alert" hidden></p>
  <div class="tw" id="tw"></div>
</main>

<div class="ov" id="ov"></div>
<div class="modal fm" id="modal" role="dialog" aria-modal="true">
  <h4 id="mTitle"></h4>
  <form id="mForm" autocomplete="off" novalidate>
    <div class="grid2" id="mFields"></div>
    <p class="msg err" id="mErr" role="alert"></p>
    <div class="acts">
      <button class="btn ghost sm" type="button" id="mCancel">Batal</button>
      <button class="btn sm" type="submit" id="mSave">Simpan</button>
    </div>
  </form>
</div>
<div class="toast" id="toast"></div>

<script src="admin.js"></script>
<script>
/* ================= Skema kolom per sheet =================
   Untuk menambah kolom baru: tambah satu baris di 'fields' (name = judul kolom di Sheets).
   type: text | textarea | number | select | check | list (list = satu poin per baris, disimpan dipisah "|")
   tabel: daftar kolom yang ditampilkan di tabel. */
const SKEMA = {
  Agen: {
    judul:'Agen', satuan:'agen',
    note:'Agen menerima pesanan lewat WhatsApp pribadi. Bagikan link toko dengan ?agen=kode.',
    kunci:'kode', tabel:['kode','nama','wa','alamat','aktif'],
    fields:[
      { name:'kode', label:'Kode agen', req:1, hint:'Huruf kecil/angka tanpa spasi, mis. trimiyem. Dipakai di link ?agen=kode.' },
      { name:'nama', label:'Nama agen', req:1 },
      { name:'wa', label:'Nomor WhatsApp', req:1, hint:'Format 62812xxxxxxxx (tanpa + dan spasi).', inputmode:'numeric' },
      { name:'aktif', label:'Tampil / aktif', type:'check' },
      { name:'alamat', label:'Alamat (tampil di header)', full:1, hint:'Kosong = "Kalurahan Kedungsari".' },
      { name:'logo', label:'Logo', full:1, hint:'Nama file di repo, mis. logo-agen/MahaMeru.png. Kosong = tanpa logo.' }
    ]
  },
  Produk: {
    judul:'Produk', satuan:'produk',
    note:'Untuk mengunggah file foto/video baru, gunakan Kelola Foto & Video. Di sini Anda bisa mengetik/menyusun daftar media.',
    kunci:'id', tabel:['id','nama','kategori','harga','hargaPromo','status','aktif'],
    fields:[
      { name:'id', label:'ID produk', req:1, hint:'Unik, mis. p15. Jangan diubah bila sudah ada pesanan.' },
      { name:'kategori', label:'Kategori', list:'kategori', hint:'Pilih yang ada atau ketik baru (huruf kecil).' },
      { name:'nama', label:'Nama produk', req:1, full:1 },
      { name:'satuan', label:'Satuan', req:1, hint:'mis. kg, pack, bungkus' },
      { name:'icon', label:'Ikon (emoji)', hint:'Tampil bila produk belum punya foto.' },
      { name:'harga', label:'Harga (Rp)', type:'number', req:1 },
      { name:'hargaPromo', label:'Harga promo (Rp)', type:'number', hint:'Kosong = tidak promo. Isi bersama status "promo".' },
      { name:'status', label:'Status', type:'select', opsi:[['', 'Normal'],['baru','Baru'],['promo','Promo'],['habis','Habis']] },
      { name:'aktif', label:'Tampil / aktif', type:'check' },
      { name:'deskripsi', label:'Deskripsi', type:'list', full:1, hint:'Satu poin per baris.' },
      { name:'media', label:'Foto & video (maks 3)', type:'list', full:1, hint:'Satu per baris: nama file di repo (mis. produk-foto/ikan.jpg), link YouTube, atau link https. Yang paling atas jadi sampul di toko.' }
    ]
  },
  Banner: {
    judul:'Banner', satuan:'banner',
    note:'Banner tampil bergantian di bagian atas toko.',
    kunci:'gambar', tabel:['gambar','judul','subjudul','link','aktif'],
    fields:[
      { name:'gambar', label:'Gambar', req:1, full:1, hint:'Nama file di repo, mis. produk-foto/cabai.jpg, atau link https.' },
      { name:'judul', label:'Judul', full:1 },
      { name:'subjudul', label:'Subjudul', full:1 },
      { name:'link', label:'Link saat diklik', hint:'mis. #produk' },
      { name:'aktif', label:'Tampil / aktif', type:'check' }
    ]
  },
  Testimoni: {
    judul:'Testimoni', satuan:'testimoni',
    note:'Isi teks, gambar (screenshot WA), atau keduanya.',
    kunci:'nama', tabel:['nama','teks','gambar','aktif'],
    fields:[
      { name:'nama', label:'Nama pembeli', full:1 },
      { name:'teks', label:'Teks testimoni', type:'textarea', full:1 },
      { name:'gambar', label:'Gambar', full:1, hint:'Nama file di repo, mis. produk-foto/testi1.jpg, atau link https.' },
      { name:'aktif', label:'Tampil / aktif', type:'check' }
    ]
  }
};
const URUT = ['Produk','Agen','Banner','Testimoni'];

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => 'Rp ' + Math.round(Number(n) || 0).toLocaleString('id-ID');
let toastTimer;
function toast(t){ const e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => e.classList.remove('show'), 3200); }

let cur = 'Produk';
const DATA = {};     // nama sheet -> { headers, rows }
let editing = null;  // { row, orig } atau null (baru)

const isOn = v => String(v).trim().toUpperCase() !== 'FALSE';
const kosong = v => v === '' || v == null;

/* ================= Muat ================= */
async function muat(name){
  name = name || cur;
  $('loadErr').hidden = true;
  try {
    const d = await Admin.get({ action:'tabel', sheet:name });
    DATA[name] = { headers: d.headers, rows: d.rows };
    render();
  } catch(e){
    if(e.auth) return;
    $('loadErr').hidden = false; $('loadErr').textContent = e.message + ' — tekan "Muat ulang" untuk mencoba lagi.';
  }
}

/* ================= Tampilan ================= */
function renderTabs(){
  $('tabs').innerHTML = URUT.map(n => {
    const c = DATA[n] ? `<small>${DATA[n].rows.length}</small>` : '';
    return `<button class="tab" role="tab" type="button" data-t="${n}" aria-selected="${n === cur}">${esc(SKEMA[n].judul)}${c}</button>`;
  }).join('');
}
function cellHtml(col, r){
  const v = r[col];
  if(col === 'aktif') return isOn(v) ? 'Ya' : '<span style="color:var(--red);font-weight:700">Tidak</span>';
  if(kosong(v)) return '<span style="color:#aab">—</span>';
  if(col === 'harga' || col === 'hargaPromo') return rp(v);
  return `<div class="trunc" title="${esc(v)}">${esc(v)}</div>`;
}
function render(){
  renderTabs();
  const S = SKEMA[cur], D = DATA[cur];
  $('note').textContent = S.note;
  if(!D){ $('tw').innerHTML = '<div class="empty">Memuat…</div>'; return; }
  const q = $('q').value.trim().toLowerCase();
  const cols = S.tabel.filter(c => D.headers.indexOf(c) !== -1);
  const rows = D.rows.filter(r => !q || cols.concat(S.fields.map(f => f.name)).some(c => String(r[c] == null ? '' : r[c]).toLowerCase().indexOf(q) !== -1));
  if(!rows.length){
    $('tw').innerHTML = `<div class="empty">${D.rows.length ? 'Tidak ada yang cocok dengan pencarian.' : 'Belum ada data. Tekan "+ Tambah".'}</div>`;
    return;
  }
  $('tw').innerHTML = `<table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}<th></th></tr></thead><tbody>` +
    rows.map(r => `<tr class="${isOn(r.aktif) ? '' : 'off'}">${cols.map(c => `<td>${cellHtml(c, r)}</td>`).join('')}
      <td class="act"><button class="btn ghost sm" data-edit="${r._row}" type="button">Ubah</button><button class="btn ghost sm" data-del="${r._row}" type="button" style="color:var(--red);border-color:var(--red)">Hapus</button></td></tr>`).join('') +
    '</tbody></table>';
}
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-t]'); if(!b) return;
  cur = b.dataset.t; $('q').value = ''; render(); if(!DATA[cur]) muat(cur);
});
$('q').addEventListener('input', render);
$('reloadBtn').addEventListener('click', () => muat().then(() => toast('Data dimuat ulang')));
$('logoutBtn').addEventListener('click', () => Admin.logout());

/* ================= Formulir ================= */
function fieldHtml(f, v){
  const id = 'f_' + f.name, t = f.type || 'text';
  const hint = f.hint ? `<div class="h">${esc(f.hint)}</div>` : '';
  const cls = 'field' + (f.full ? ' full' : '');
  const lab = `<label for="${id}">${esc(f.label)}${f.req ? ' <span class="req">*</span>' : ''}</label>`;
  if(t === 'check') return `<div class="${cls}"><label class="chk"><input type="checkbox" id="${id}" ${isOn(v) ? 'checked' : ''}> ${esc(f.label)}</label>${hint}</div>`;
  if(t === 'textarea') return `<div class="${cls}">${lab}<textarea id="${id}">${esc(v)}</textarea>${hint}</div>`;
  if(t === 'list') return `<div class="${cls}">${lab}<textarea id="${id}">${esc(String(v == null ? '' : v).split('|').map(x => x.trim()).filter(Boolean).join('\n'))}</textarea>${hint}</div>`;
  if(t === 'select') return `<div class="${cls}">${lab}<select id="${id}">${f.opsi.map(o => `<option value="${esc(o[0])}" ${String(v || '') === o[0] ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>${hint}</div>`;
  const dl = f.list ? ` list="dl_${f.list}"` : '';
  const kategori = f.list ? `<datalist id="dl_${f.list}">${[...new Set((DATA.Produk ? DATA.Produk.rows : []).map(r => String(r.kategori || '').trim()).filter(Boolean))].map(k => `<option value="${esc(k)}">`).join('')}</datalist>` : '';
  return `<div class="${cls}">${lab}<input id="${id}" type="${t === 'number' ? 'number' : 'text'}" ${t === 'number' ? 'min="0" step="any"' : ''}${f.inputmode ? ` inputmode="${f.inputmode}"` : ''}${dl} value="${esc(v)}">${kategori}${hint}</div>`;
}
function bukaForm(row){
  const S = SKEMA[cur], D = DATA[cur];
  const r = row ? D.rows.find(x => x._row === row) : null;
  if(row && !r) return;
  editing = r ? { row: r._row, orig: r[D.headers[0]], mediaAwal: String(r.media == null ? '' : r.media).split('|').map(x => x.trim()).filter(Boolean).join('|') } : null;
  const v = r || { aktif: true };
  if(!r && cur === 'Produk'){
    const n = D.rows.map(x => /^p(\d+)$/i.exec(String(x.id))).filter(Boolean).map(m => +m[1]);
    v.id = 'p' + ((n.length ? Math.max.apply(null, n) : 0) + 1);
  }
  $('mTitle').textContent = (r ? 'Ubah ' : 'Tambah ') + S.satuan;
  const ada = S.fields.filter(f => D.headers.indexOf(f.name) !== -1);
  const hilang = S.fields.filter(f => D.headers.indexOf(f.name) === -1).map(f => f.name);
  $('mFields').innerHTML = ada.map(f => fieldHtml(f, v[f.name])).join('');
  $('mErr').textContent = hilang.length ? 'Kolom belum ada di sheet dan tidak akan tersimpan: ' + hilang.join(', ') : '';
  $('mSave').disabled = false; $('mSave').textContent = 'Simpan';
  $('ov').classList.add('open'); $('modal').classList.add('open');
  const first = $('mFields').querySelector('input:not([type=checkbox]),textarea,select'); if(first) setTimeout(() => first.focus(), 50);
}
function tutupForm(){ $('mSave').disabled = false; $('mSave').textContent = 'Simpan'; $('ov').classList.remove('open'); $('modal').classList.remove('open'); }
$('addBtn').addEventListener('click', () => { if(DATA[cur]) bukaForm(0); });
$('tw').addEventListener('click', e => {
  const ed = e.target.closest('[data-edit]'); if(ed) return bukaForm(+ed.dataset.edit);
  const dl = e.target.closest('[data-del]'); if(dl) return hapus(+dl.dataset.del);
});
$('mCancel').addEventListener('click', tutupForm);
$('ov').addEventListener('click', () => { if($('modal').classList.contains('open')) tutupForm(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') tutupForm(); });

function ambilForm(){
  const S = SKEMA[cur], D = DATA[cur], out = {};
  S.fields.forEach(f => {
    if(D.headers.indexOf(f.name) === -1) return;
    const el = $('f_' + f.name), t = f.type || 'text';
    out[f.name] = t === 'check' ? el.checked
      : t === 'list' ? el.value.split('\n').map(x => x.replace(/\|/g, '/').trim()).filter(Boolean).join('|')
      : el.value.trim();
  });
  if(editing && out.media !== undefined && out.media === editing.mediaAwal) delete out.media;   // tidak berubah: jangan kirim
  if(out.media && out.media.split('|').length > 3){ out.__err = 'Maksimal 3 foto/video per produk.'; }
  return out;
}
async function hapusKirim(){
  $('mSave').disabled = true; $('mSave').textContent = 'Menghapus…';
  try {
    await Admin.post({ action:'hapusBaris', sheet:cur, row: editing.row, orig: editing.orig });
    tutupForm(); toast('Terhapus'); await muat(cur);
  } catch(err){
    if(err.auth) return;
    $('mErr').textContent = err.message; $('mSave').disabled = false; $('mSave').textContent = 'Ya, hapus';
  }
}
$('mForm').addEventListener('submit', async e => {
  e.preventDefault();
  if(editing && editing.hapus) return hapusKirim();
  const S = SKEMA[cur], data = ambilForm();
  if(data.__err){ $('mErr').textContent = data.__err; return; }
  for(const f of S.fields){
    if(f.req && data[f.name] !== undefined && data[f.name] === ''){ $('mErr').textContent = `"${f.label}" wajib diisi.`; return; }
  }
  $('mErr').textContent = ''; $('mSave').disabled = true; $('mSave').textContent = 'Menyimpan…';
  try {
    await Admin.post({ action:'simpanBaris', sheet:cur, row: editing ? editing.row : 0, orig: editing ? editing.orig : '', data });
    tutupForm(); toast('Tersimpan'); await muat(cur);
  } catch(err){
    if(err.auth) return;
    $('mErr').textContent = err.message; $('mSave').disabled = false; $('mSave').textContent = 'Simpan';
  }
});

/* ================= Hapus ================= */
function hapus(row){
  const D = DATA[cur], r = D.rows.find(x => x._row === row); if(!r) return;
  const nama = r.nama || r.judul || r[D.headers[0]] || ('baris ' + row);
  editing = { row, orig: r[D.headers[0]], hapus: true };
  $('mTitle').textContent = 'Hapus ' + SKEMA[cur].satuan + '?';
  $('mFields').innerHTML = `<p class="full" style="grid-column:1/-1;font-size:.92rem">“${esc(nama)}” akan dihapus permanen dari sheet ${esc(cur)}. Untuk sekadar menyembunyikan, pilih Ubah lalu matikan "Tampil / aktif".</p>`;
  $('mErr').textContent = ''; $('mSave').disabled = false; $('mSave').textContent = 'Ya, hapus';
  $('ov').classList.add('open'); $('modal').classList.add('open');
}
/* ================= Mulai ================= */
